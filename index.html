<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ranking głosów</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#0b0b0f;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:30px;
}

.container{
    width:100%;
    max-width:820px;
}

h1{
    text-align:center;
    font-size:38px;
    margin:0 0 28px;
}

#ranking{
    position:relative;
    width:100%;
}

.player{
    position:absolute;
    left:0;
    width:100%;
    height:72px;
    background:#15151c;
    border:1px solid #292933;
    border-radius:16px;
    padding:0 22px;
    display:flex;
    align-items:center;
    transition:
        transform .75s cubic-bezier(.2,.8,.2,1),
        border-color .3s,
        box-shadow .3s;
}

.player.top{
    border-color:#f5c542;
    box-shadow:0 0 22px rgba(245,197,66,.15);
}

.position{
    width:58px;
    font-size:24px;
    font-weight:800;
    color:#777;
}

.player.top .position{
    color:#f5c542;
}

.name{
    flex:1;
    font-size:20px;
    font-weight:700;
}

.votes{
    font-size:20px;
    font-weight:700;
}

.votes span{
    color:#7dff88;
}
</style>
</head>

<body>

<div class="container">
    <h1>🏆 Ranking głosów</h1>
    <div id="ranking"></div>
</div>

<script>

const names = [
"GACEK33","Kefir","Bober","Ziemniok","Kabanos","Ogórek","Parówa",
"Boczek","Kartofel","Papaj","Dzban","Kisiel","Serek","Majonez",
"Cebulak","Pączek","Banan","Kremówka","Pyza","Kluska","Mopik",
"Bobr","Krecik","Pieseł","Żabka","Szczurek","Chlebek","Bułka",
"Mleczyk","Jogurt","Budyn","Ketchup","Musztarda","Pieróg","Rosół",
"Schabik","Czosnek","Marchew","Buraczek","Fasolka","Kalafior",
"Brokuł","Arbuzik","Kefirek","Kefir69","PanKefir","KefirEnjoyer",
"BoberPL","ZiemniakTV","Dzbanek","Cebulson","Kabanosik","Parowkowy",
"Boczuś","Ogóras","Kartofel69","Papajek","Mop","Kisielu","SerekPL",
"Bananowy","Pączus","Klusior","Pyziak","Chlebson","Bułeczkowy",
"Jogurt69","Mleczny","Majonezik","Ketchupik","Musztardowy",
"BobrEnjoyer","KrecikPL","Zaba69","Piesełek","SzczurPL","XDkefir",
"XDDZiemniak","NieMamNicku","Random","Nobody","Anon","Ktosik",
"Widz","ZwyklyWidz","Losowy","DzbanekPL","KefirXD","BoberXD",
"ZiemniakXD","KabanosXD","OgorekXD","MopXD","Kacper","Mati",
"Kuba","Szymon","Wiktor","Oskar"
];

const players = names.map((name,index)=>({
    id:index,
    name:name,
    votes:0,
    target:0
}));

const ranking=document.getElementById("ranking");
const GAP=82;

players.forEach(player=>{

    const el=document.createElement("div");

    el.className="player";
    el.dataset.id=player.id;

    el.innerHTML=`
        <div class="position">#${player.id+1}</div>
        <div class="name">${player.name}</div>
        <div class="votes">
            <span>0</span> głosów
        </div>
    `;

    ranking.appendChild(el);
});

function getElement(player){
    return document.querySelector(
        `.player[data-id="${player.id}"]`
    );
}

function sortPlayers(){

    players.sort((a,b)=>{

        if(b.votes!==a.votes)
            return b.votes-a.votes;

        return a.id-b.id;
    });
}

function render(){

    sortPlayers();

    players.forEach((player,index)=>{

        const el=getElement(player);

        el.querySelector(".position").textContent=
            "#"+(index+1);

        el.querySelector(".votes span").textContent=
            player.votes;

        el.classList.toggle("top",index===0);

        el.style.transform=
            `translateY(${index*GAP}px)`;
    });

    ranking.style.height=
        ((players.length-1)*GAP+72)+"px";
}

/*
    CO SEKUNDĘ:
    każda osoba dostaje 1–5 widzów.
    każdy widz daje 1–10 głosów.
*/
function addVotes(){

    players.forEach(player=>{

        const newViewers=
            Math.floor(Math.random()*5)+1;

        for(let i=0;i<newViewers;i++){

            const votesFromViewer=
                Math.floor(Math.random()*10)+1;

            player.target+=votesFromViewer;
        }
    });
}

/*
    Płynne naliczanie głosów.
*/
let lastUpdate=performance.now();

function animate(time){

    if(time-lastUpdate>=45){

        players.forEach(player=>{

            if(player.votes<player.target){
                player.votes++;
            }
        });

        render();

        lastUpdate=time;
    }

    requestAnimationFrame(animate);
}

render();

/* Nowi widzowie co sekundę */
setInterval(addVotes,1000);

/* Płynny licznik */
requestAnimationFrame(animate);

</script>

</body>
</html>
