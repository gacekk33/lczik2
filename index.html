<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking głosów</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #0b0b0f;
    color: white;
    font-family: Arial, sans-serif;
    padding: 30px;
}

.container {
    width: 100%;
    max-width: 1250px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 38px;
    margin: 0 0 18px;
}

.total-box {
    background: #15151c;
    border: 1px solid #292933;
    border-radius: 16px;
    padding: 18px 22px;
    margin-bottom: 18px;
    text-align: center;
}

.total-title {
    color: #888;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
}

.total-votes {
    font-size: 30px;
    font-weight: 800;
    color: #7dff88;
}

.content {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 430px;
    gap: 22px;
    align-items: start;
}

#ranking {
    position: relative;
}

.player {
    height: 72px;
    margin-bottom: 10px;
    background: #15151c;
    border: 1px solid #292933;
    border-radius: 16px;
    padding: 0 22px;
    display: flex;
    align-items: center;

    transition:
        transform 1s cubic-bezier(.16,1,.3,1),
        border-color .35s ease,
        box-shadow .35s ease;
}

.player.top {
    border-color: #f5c542;
    box-shadow: 0 0 25px rgba(245,197,66,.18);
}

.position {
    width: 58px;
    font-size: 24px;
    font-weight: 800;
    color: #777;
}

.top .position {
    color: #f5c542;
}

.name {
    flex: 1;
    font-size: 20px;
    font-weight: 700;
}

.votes {
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}

.vote-count {
    color: #7dff88;
    min-width: 70px;
    text-align: right;
}

.vote-percent {
    color: #888;
    font-size: 14px;
    min-width: 55px;
    text-align: right;
}


/* =========================
   TOP 3 - GÓRKA WYBORCZA
========================= */

.top3-box {
    background: #15151c;
    border: 1px solid #292933;
    border-radius: 16px;
    padding: 22px;
    position: sticky;
    top: 30px;
}

.top3-title {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
}

.top3-subtitle {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-bottom: 20px;
}

.chart {
    height: 360px;
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 18px;
    padding: 0 12px 35px;
    border-bottom: 2px solid #292933;
}

.chart::before,
.chart::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: #202028;
}

.chart::before {
    top: 25%;
}

.chart::after {
    top: 50%;
}

.bar-wrap {
    width: 30%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    z-index: 2;
}

.bar {
    width: 100%;
    max-width: 105px;
    border-radius: 12px 12px 3px 3px;
    position: relative;

    transition:
        height 1s cubic-bezier(.16,1,.3,1);

    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.bar.first {
    background: linear-gradient(
        to top,
        #a77b00,
        #f5c542
    );
}

.bar.second {
    background: linear-gradient(
        to top,
        #626262,
        #bdbdbd
    );
}

.bar.third {
    background: linear-gradient(
        to top,
        #704b2a,
        #a8784d
    );
}

.bar-name {
    position: absolute;
    bottom: calc(100% + 10px);
    white-space: nowrap;
    font-weight: 800;
    font-size: 15px;
}

.bar-votes {
    position: absolute;
    bottom: calc(100% + 32px);
    white-space: nowrap;
    color: #7dff88;
    font-size: 13px;
    font-weight: 700;
}

.medal {
    position: absolute;
    bottom: -31px;
    font-size: 20px;
}

.percent {
    position: absolute;
    bottom: calc(100% + 50px);
    white-space: nowrap;
    font-size: 12px;
    color: #888;
}

.chart-label {
    position: absolute;
    bottom: 7px;
    color: #555;
    font-size: 11px;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

    .content {
        grid-template-columns: 1fr;
    }

    .top3-box {
        position: static;
    }
}

@media (max-width: 550px) {

    body {
        padding: 15px;
    }

    h1 {
        font-size: 30px;
    }

    .player {
        padding: 0 14px;
    }

    .position {
        width: 48px;
    }

    .name {
        font-size: 17px;
    }

    .votes {
        font-size: 16px;
    }

    .vote-percent {
        font-size: 12px;
        min-width: 45px;
    }

    .top3-box {
        padding: 15px;
    }
}

</style>
</head>

<body>

<div class="container">

    <h1>🏆 Ranking głosów</h1>

    <div class="total-box">
        <div class="total-title">Wszystkie głosy</div>
        <div class="total-votes" id="totalVotes">0</div>
    </div>

    <div class="content">

        <div id="ranking"></div>

        <div class="top3-box">

            <div class="top3-title">
                📊 TOP 3
            </div>

            <div class="top3-subtitle">
                Wyniki głosowania
            </div>

            <div class="chart">

                <div class="bar-wrap">
                    <div class="bar second" id="bar2">
                        <div class="bar-name" id="name2"></div>
                        <div class="bar-votes" id="votes2"></div>
                        <div class="percent" id="percent2"></div>
                        <div class="medal">🥈</div>
                    </div>
                </div>

                <div class="bar-wrap">
                    <div class="bar first" id="bar1">
                        <div class="bar-name" id="name1"></div>
                        <div class="bar-votes" id="votes1"></div>
                        <div class="percent" id="percent1"></div>
                        <div class="medal">🥇</div>
                    </div>
                </div>

                <div class="bar-wrap">
                    <div class="bar third" id="bar3">
                        <div class="bar-name" id="name3"></div>
                        <div class="bar-votes" id="votes3"></div>
                        <div class="percent" id="percent3"></div>
                        <div class="medal">🥉</div>
                    </div>
                </div>

                <div class="chart-label">
                    LICZBA GŁOSÓW
                </div>

            </div>
        </div>

    </div>
</div>

<script>

const startingData = [
    ["GACEK33", 11980],
    ["2kosiara", 12100],
    ["Never Give Up", 4800],
    ["Kitler", 10200],
    ["p*bluu", 5600],
    ["bl0ondyna4", 11900],
    ["Beluga", 7000],
    ["cholewawa_rozix", 12010],
    ["siemakoledzy", 8100],
    ["Liluss3", 12080]
];

let players = startingData.map((p, i) => ({
    id: i,
    name: p[0],
    votes: p[1],
    target: p[1]
}));

const ranking = document.getElementById("ranking");
const totalVotes = document.getElementById("totalVotes");


function createElements() {

    players.forEach(player => {

        const el = document.createElement("div");

        el.className = "player";
        el.dataset.id = player.id;

        el.innerHTML = `
            <div class="position"></div>
            <div class="name">${player.name}</div>
            <div class="votes">
                <span class="vote-count">${player.votes}</span> głosów
                <span class="vote-percent">0%</span>
            </div>
        `;

        ranking.appendChild(el);
    });
}


function updateVoteNumbers() {

    const total = players.reduce(
        (sum, player) => sum + player.votes,
        0
    );

    players.forEach(player => {

        const el = document.querySelector(
            `.player[data-id="${player.id}"]`
        );

        if (el) {

            el.querySelector(".vote-count").textContent =
                player.votes.toLocaleString("pl-PL");

            el.querySelector(".vote-percent").textContent =
                ((player.votes / total) * 100).toFixed(1) + "%";
        }
    });

    totalVotes.textContent =
        total.toLocaleString("pl-PL");

    updateTop3();
}


/* =========================
   TOP 3 GÓRKA
========================= */

function updateTop3() {

    const sorted = [...players].sort(
        (a, b) => b.votes - a.votes
    );

    const top3 = sorted.slice(0, 3);

    if (top3.length < 3) return;

    top3.forEach((player, index) => {

        const number = index + 1;

        const bar =
            document.getElementById(`bar${number}`);

        const name =
            document.getElementById(`name${number}`);

        const votes =
            document.getElementById(`votes${number}`);

        const percent =
            document.getElementById(`percent${number}`);


        /*
           Wysokości słupków:
           TOP 1 = 100%
           TOP 2 = 58%
           TOP 3 = 38%
        */

        const heights = [
            100,
            58,
            38
        ];

        const height = heights[index];

        bar.style.height =
            height + "%";


        name.textContent =
            player.name;

        votes.textContent =
            player.votes.toLocaleString("pl-PL");


        const total =
            players.reduce(
                (sum, p) => sum + p.votes,
                0
            );

        percent.textContent =
            ((player.votes / total) * 100)
            .toFixed(1) + "%";
    });
}


/* =========================
   DODAWANIE GŁOSÓW
========================= */

function giveVotes() {

    const amountOfPlayers =
        Math.floor(Math.random() * 6) + 3;

    const selected = [];

    while (
        selected.length < amountOfPlayers
    ) {

        const player =
            players[
                Math.floor(
                    Math.random() * players.length
                )
            ];

        if (!selected.includes(player)) {
            selected.push(player);
        }
    }

    selected.forEach(player => {

        const amount =
            Math.floor(Math.random() * 10) + 1;

        player.target += amount;
    });
}


/* =========================
   LICZNIKI
========================= */

function animateCounters() {

    let changed = false;

    players.forEach(player => {

        if (player.votes < player.target) {

            player.votes++;
            changed = true;
        }
    });

    if (changed) {
        updateVoteNumbers();
    }

    requestAnimationFrame(
        animateCounters
    );
}


/* =========================
   RANKING + PŁYNNE PRZESUWANIE
========================= */

function updateRanking() {

    const oldPositions = new Map();

    document
        .querySelectorAll(".player")
        .forEach(el => {

            oldPositions.set(
                el.dataset.id,
                el.getBoundingClientRect().top
            );
        });


    const sorted =
        [...players].sort(
            (a, b) => b.votes - a.votes
        );


    sorted.forEach((player, index) => {

        const el =
            document.querySelector(
                `.player[data-id="${player.id}"]`
            );

        el.querySelector(".position")
            .textContent =
            "#" + (index + 1);

        el.classList.toggle(
            "top",
            index === 0
        );

        ranking.appendChild(el);
    });


    sorted.forEach(player => {

        const el =
            document.querySelector(
                `.player[data-id="${player.id}"]`
            );

        const oldY =
            oldPositions.get(
                String(player.id)
            );

        const newY =
            el.getBoundingClientRect().top;


        if (oldY !== undefined) {

            const difference =
                oldY - newY;


            if (Math.abs(difference) > 1) {

                el.style.transition = "none";

                el.style.transform =
                    `translateY(${difference}px)`;


                requestAnimationFrame(() => {

                    requestAnimationFrame(() => {

                        el.style.transition =
                            "transform 1s cubic-bezier(.16,1,.3,1), border-color .35s ease, box-shadow .35s ease";

                        el.style.transform =
                            "translateY(0)";
                    });
                });
            }
        }
    });

    updateTop3();
}


/* =========================
   START
========================= */

createElements();

updateRanking();

updateVoteNumbers();

animateCounters();


setInterval(
    giveVotes,
    1000
);


setInterval(
    updateRanking,
    250
);

</script>

</body>
</html>
