<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ranking głosów</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#0b0b0f;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:30px;
}

.wrapper{
    width:100%;
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:38px;
    margin:0 0 8px;
}

.total{
    text-align:center;
    color:#8cff8c;
    font-size:19px;
    font-weight:bold;
    margin-bottom:30px;
}

/* TOP 3 */

.top3{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:18px;
    height:280px;
    margin-bottom:35px;
}

.top-card{
    width:180px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
}

.top-name{
    font-weight:bold;
    font-size:18px;
    margin-bottom:8px;
}

.top-percent{
    font-size:16px;
    color:#8cff8c;
    font-weight:bold;
    margin-bottom:8px;
}

.bar-wrapper{
    width:100%;
    height:190px;
    display:flex;
    align-items:flex-end;
}

.bar{
    width:100%;
    border-radius:14px 14px 5px 5px;
    background:linear-gradient(to top,#292933,#555563);
    min-height:25px;
    transition:height .7s cubic-bezier(.2,.8,.2,1);
}

.top-card:first-child .bar{
    background:linear-gradient(to top,#d6a900,#f5c542);
}

.rank-number{
    margin-top:8px;
    font-size:18px;
    font-weight:bold;
    color:#777;
}

/* RANKING */

#ranking{
    position:relative;
    width:100%;
}

.player{
    position:absolute;
    left:0;
    width:100%;
    height:68px;
    background:#15151c;
    border:1px solid #292933;
    border-radius:15px;
    padding:0 20px;
    display:flex;
    align-items:center;

    transition:
        transform .7s cubic-bezier(.2,.8,.2,1),
        border-color .3s,
        box-shadow .3s;
}

.player.top{
    border-color:#f5c542;
    box-shadow:0 0 22px rgba(245,197,66,.15);
}

.position{
    width:60px;
    font-size:21px;
    font-weight:800;
    color:#777;
}

.player.top .position{
    color:#f5c542;
}

.name{
    flex:1;
    font-size:18px;
    font-weight:700;
}

.votes{
    font-size:18px;
    font-weight:bold;
    min-width:125px;
    text-align:right;
}

.votes span{
    color:#8cff8c;
}

.percent{
    width:70px;
    text-align:right;
    color:#aaa;
    font-size:15px;
}
</style>
</head>

<body>

<div class="wrapper">

    <h1>🏆 Ranking głosów</h1>

    <div class="total">
        ŁĄCZNA LICZBA GŁOSÓW: <span id="totalVotes">0</span>
    </div>

    <div class="top3">

        <div class="top-card">
            <div class="top-name" id="top2Name">---</div>
            <div class="top-percent" id="top2Percent">0%</div>

            <div class="bar-wrapper">
                <div class="bar" id="bar2"></div>
            </div>

            <div class="rank-number">🥈 TOP 2</div>
        </div>

        <div class="top-card">
            <div class="top-name" id="top1Name">---</div>
            <div class="top-percent" id="top1Percent">100%</div>

            <div class="bar-wrapper">
                <div class="bar" id="bar1"></div>
            </div>

            <div class="rank-number">🥇 TOP 1</div>
        </div>

        <div class="top-card">
            <div class="top-name" id="top3Name">---</div>
            <div class="top-percent" id="top3Percent">0%</div>

            <div class="bar-wrapper">
                <div class="bar" id="bar3"></div>
            </div>

            <div class="rank-number">🥉 TOP 3</div>
        </div>

    </div>

    <div id="ranking"></div>

</div>

<script>

const names = [
"GACEK33","Kefir","Bober","Ziemniok","Kabanos","Ogórek","Parówa",
"Boczek","Kartofel","Papaj","Dzban","Kisiel","Serek","Majonez",
"Cebulak","Pączek","Banan","Kremówka","Pyza","Kluska","Mopik",
"Bobr","Krecik","Pieseł","Żabka","Szczurek","Chlebek","Bułka",
"Mleczyk","Jogurt","Budyn","Ketchup","Musztarda","Pieróg","Rosół",
"Schabik","Czosnek","Marchew","Buraczek","Fasolka","Kalafior",
"Brokuł","Arbuzik","Kefirek","Kefir69","PanKefir","KefirEnjoyer",
"BoberPL","ZiemniakTV","Dzbanek","Cebulson","Kabanosik","Parowkowy",
"Boczuś","Ogóras","Kartofel69","Papajek","Mop","Kisielu","SerekPL",
"Bananowy","Pączus","Klusior","Pyziak","Chlebson","Bułeczkowy",
"Jogurt69","Mleczny","Majonezik","Ketchupik","Musztardowy",
"BobrEnjoyer","KrecikPL","Zaba69","Piesełek","SzczurPL","XDkefir",
"XDDZiemniak","NieMamNicku","Random","Nobody","Anon","Ktosik",
"Widz","ZwyklyWidz","Losowy","DzbanekPL","KefirXD","BoberXD",
"ZiemniakXD","KabanosXD","OgorekXD","MopXD","Kacper","Mati",
"Kuba","Szymon","Wiktor","Oskar"
];

const players = names.map((name,index)=>({
    id:index,
    name:name,
    votes:0,
    target:0
}));

const ranking=document.getElementById("ranking");
const GAP=78;

/* Tworzenie graczy */

players.forEach(player=>{

    const el=document.createElement("div");

    el.className="player";
    el.dataset.id=player.id;

    el.innerHTML=`
        <div class="position">#${player.id+1}</div>
        <div class="name">${player.name}</div>
        <div class="votes">
            <span>0</span> głosów
        </div>
        <div class="percent">0%</div>
    `;

    ranking.appendChild(el);
});

function getElement(player){
    return document.querySelector(
        `.player[data-id="${player.id}"]`
    );
}

function sortPlayers(){

    players.sort((a,b)=>{

        if(b.votes!==a.votes)
            return b.votes-a.votes;

        return a.id-b.id;

    });
}

/*
    MAKSYMALNIE 3 OSOBY
    dostają głosy podczas jednej sekundy.

    Każda z nich dostaje 1–5 głosów.
*/

function addVotes(){

    const shuffled=[...players]
        .sort(()=>Math.random()-0.5);

    const amountOfPlayers=
        Math.floor(Math.random()*3)+1;

    for(let i=0;i<amountOfPlayers;i++){

        const player=shuffled[i];

        const amount=
            Math.floor(Math.random()*5)+1;

        player.target+=amount;
    }
}

/*
    Ranking + procenty
*/

function render(){

    sortPlayers();

    const top1=players[0]?.votes || 1;
    const total=players.reduce(
        (sum,p)=>sum+p.votes,0
    );

    document.getElementById("totalVotes")
        .textContent=total.toLocaleString("pl-PL");

    players.forEach((player,index)=>{

        const el=getElement(player);

        el.querySelector(".position")
            .textContent="#"+(index+1);

        el.querySelector(".votes span")
            .textContent=player.votes;

        const percentage=
            (player.votes/top1)*100;

        el.querySelector(".percent")
            .textContent=
            percentage.toFixed(1)+"%";

        el.classList.toggle(
            "top",
            index===0
        );

        el.style.transform=
            `translateY(${index*GAP}px)`;
    });

    ranking.style.height=
        ((players.length-1)*GAP+68)+"px";

    updateTop3();
}

/*
    TOP 3 słupki
*/

function updateTop3(){

    const first=players[0];
    const second=players[1];
    const third=players[2];

    if(!first) return;

    const firstVotes=Math.max(first.votes,1);

    const p1=100;
    const p2=(second.votes/firstVotes)*100;
    const p3=(third.votes/firstVotes)*100;

    document.getElementById("top1Name")
        .textContent=first.name;

    document.getElementById("top2Name")
        .textContent=second.name;

    document.getElementById("top3Name")
        .textContent=third.name;

    document.getElementById("top1Percent")
        .textContent=p1.toFixed(1)+"%";

    document.getElementById("top2Percent")
        .textContent=p2.toFixed(1)+"%";

    document.getElementById("top3Percent")
        .textContent=p3.toFixed(1)+"%";

    document.getElementById("bar1")
        .style.height="100%";

    document.getElementById("bar2")
        .style.height=Math.max(p2,5)+"%";

    document.getElementById("bar3")
        .style.height=Math.max(p3,5)+"%";
}

/*
    Płynne naliczanie głosów.
*/

let lastUpdate=performance.now();

function animate(time){

    if(time-lastUpdate>=50){

        players.forEach(player=>{

            if(player.votes<player.target){
                player.votes++;
            }

        });

        render();

        lastUpdate=time;
    }

    requestAnimationFrame(animate);
}

render();

/* Nowe głosy co sekundę */
setInterval(addVotes,1000);

/* Start animacji */
requestAnimationFrame(animate);

</script>

</body>
</html>
